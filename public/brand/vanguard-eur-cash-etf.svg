<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Vanguard's emblem: HMS Vanguard, a three-masted ship of the line, in Vanguard red -->
  <defs>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3B7B0"/>
      <stop offset="1" stop-color="#E98A84"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D23A42"/>
      <stop offset="1" stop-color="#9A1C24"/>
    </linearGradient>
  </defs>
  <!-- masts and bowsprit -->
  <g stroke="#E8C9B8" stroke-width="1.1" stroke-linecap="round">
    <path d="M30 70 V26"/>
    <path d="M51 70 V14"/>
    <path d="M71 70 V22"/>
    <path d="M84 63 L96 52"/>
  </g>
  <!-- square sails, three tiers per mast (smaller towards the top) -->
  <g fill="url(#sail)">
    <path d="M22 33 Q30 31 38 33 L37 41 Q30 39.5 23 41 Z"/>
    <path d="M20 44 Q30 42 40 44 L39 54 Q30 52.5 21 54 Z"/>
    <path d="M19 57 Q30 55 41 57 L40 65 Q30 63.5 20 65 Z"/>
    <path d="M44 20 Q51 18.5 58 20 L57 27 Q51 25.5 45 27 Z"/>
    <path d="M41 30 Q51 28 61 30 L60 40 Q51 38.5 42 40 Z"/>
    <path d="M39 43 Q51 41 63 43 L62 54 Q51 52.5 40 54 Z"/>
    <path d="M38 57 Q51 55 64 57 L63 65 Q51 63.5 39 65 Z"/>
    <path d="M65 29 Q71 27.5 77 29 L76 36 Q71 34.5 66 36 Z"/>
    <path d="M62 39 Q71 37 80 39 L79 49 Q71 47.5 63 49 Z"/>
    <path d="M61 52 Q71 50 81 52 L80 62 Q71 60.5 62 62 Z"/>
    <path d="M85 61 L95 53 L90 64 Z"/>
  </g>
  <!-- pennant at the main mast -->
  <path d="M51 14 L62 16 L51 18 Z" fill="#D23A42"/>
  <!-- hull with a row of gun ports -->
  <path d="M10 67 H88 Q86 72 82 80 H20 Q14 74 10 67 Z" fill="url(#hull)"/>
  <path d="M14 70.5 H84" stroke="#F3B7B0" stroke-width=".6" opacity=".6"/>
  <g fill="#3A0A0E">
    <rect x="20" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="27" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="34" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="41" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="48" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="55" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="62" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="69" y="72.5" width="3" height="2.4" rx=".4"/>
    <rect x="76" y="72.5" width="3" height="2.4" rx=".4"/>
  </g>
  <!-- the sea -->
  <path d="M6 86 Q16 82.5 26 86 T46 86 T66 86 T86 86 T96 85" stroke="#D23A42" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
</svg>
