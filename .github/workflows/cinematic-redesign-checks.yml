name: Cinematic redesign checks and release

on:
  push:
    branches: [cinematic-redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinematic-redesign-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # the portfolio data is stored encrypted (data/portfolio.json.enc); the build reads a decrypted, git-ignored copy
      - name: Decrypt portfolio data
        if: hashFiles('data/portfolio.json.enc') != ''
        env:
          PRIVATE_VIEW_PASSWORD: ${{ secrets.PRIVATE_VIEW_PASSWORD }}
        run: node tools/private/vault.mjs decrypt data/portfolio.json.enc data/portfolio.private.json
      - name: Require real portfolio data
        run: |
          test -f data/portfolio.private.json -o -f data/portfolio.json || { echo "No portfolio data, refusing to publish the sample"; exit 1; }
      - name: Build static GitHub Pages output
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /Portfolio-site
          # builds and seals the owner-only private view (tools/private/seal.mjs); without it there is none
          PRIVATE_VIEW_PASSWORD: ${{ secrets.PRIVATE_VIEW_PASSWORD }}
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-pages
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/cinematic-redesign'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: cinematic-pages
          path: out/
      - name: Publish cinematic redesign to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: false
          enable_jekyll: false
          commit_message: "deploy: cinematic redesign ${{ github.sha }}"
