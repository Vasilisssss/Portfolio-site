name: Cinematic redesign checks and deployment

on:
  push:
    branches: [cinematic-redesign]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cinematic-redesign-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build static GitHub Pages output
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /Portfolio-site
      - name: Upload built site for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/cinematic-redesign'
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-pages
          path: out/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cinematic-redesign'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: cinematic-pages
          path: out/
      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: false
          enable_jekyll: false
          commit_message: "deploy: publish cinematic redesign from ${{ github.sha }}"
