# Daily portfolio data from Interactive Brokers (free: a Flex Query + GitHub Actions; no server, no login).
# Checks five times a night (Mon–Fri 22:17, Tue–Sat 01:17, 04:17, 06:17, 10:17 UTC): IBKR refreshes Activity
# statements once a day, after New York closes, and the first check that finds the new one publishes it. It updates
# data/portfolio.json on cinematic-redesign and starts the release workflow (which builds, checks and deploys).
# Trades, deposits and new or sold positions are published automatically, with a notification (an issue opened and
# closed at once, listing what changed, never amounts); a new position also gets company artwork drawn by Claude
# (card-art.yml, as a pull request). Only anomalies (totals that do not add up, a jump in return,
# the wrong statement period) publish nothing and open an issue instead; after checking, run it by hand with
# "publish anyway" ticked (the statement period can never be overridden).
# Setup: docs/ibkr-flex-setup.md (secrets IBKR_FLEX_TOKEN and IBKR_FLEX_QUERY_ID). Without them it does nothing.
# With PRIVATE_VIEW_PASSWORD the data file is kept encrypted (docs/private-view.md).
# Scheduled workflows run from the default branch, which is cinematic-redesign.
name: Daily IBKR data

on:
  schedule:
    # IBKR builds one statement per day, covering every market, overnight after New York closes (21:00 UTC). These
    # checks catch it as soon as it is ready; the first that finds it publishes, the rest find nothing new.
    - cron: "17 22 * * 1-5"
    - cron: "17 1 * * 2-6"
    - cron: "17 4 * * 2-6"
    - cron: "17 6 * * 2-6"
    - cron: "17 10 * * 2-6"
  workflow_dispatch:
    inputs:
      publish_anyway:
        description: "Publish even though the last run flagged the totals or the return as odd (only after checking them)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ibkr-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinematic-redesign

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # with PRIVATE_VIEW_PASSWORD the data lives encrypted in data/portfolio.json.enc and is updated in a decrypted,
      # git-ignored copy; a plain data/portfolio.json left from before is migrated (encrypted, then removed)
      - name: Open the portfolio data
        id: data
        env:
          PRIVATE_VIEW_PASSWORD: ${{ secrets.PRIVATE_VIEW_PASSWORD }}
        run: |
          if [ -n "$PRIVATE_VIEW_PASSWORD" ]; then
            if [ -f data/portfolio.json.enc ]; then node tools/private/vault.mjs decrypt data/portfolio.json.enc data/portfolio.private.json
            else cp data/portfolio.json data/portfolio.private.json; fi
            cp data/portfolio.private.json "$RUNNER_TEMP/before.json"
            echo "PORTFOLIO_FILE=data/portfolio.private.json" >> "$GITHUB_ENV"
            echo "encrypted=1" >> "$GITHUB_OUTPUT"
          else
            echo "PORTFOLIO_FILE=data/portfolio.json" >> "$GITHUB_ENV"
          fi

      - name: Read the IBKR Flex statement and update the data
        id: flex
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          CHANGES_FILE: ${{ runner.temp }}/changes.txt
          FORCE: ${{ inputs.publish_anyway && 'true' || 'false' }}
        run: |
          set +e
          node tools/ibkr/flex-update.mjs > "$RUNNER_TEMP/flex.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/flex.txt"   # messages carry no amounts (public log)
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.flex.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_VIEW_PASSWORD: ${{ secrets.PRIVATE_VIEW_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.data.outputs.encrypted }}" = "1" ]; then
            if cmp -s data/portfolio.private.json "$RUNNER_TEMP/before.json" && [ ! -f data/portfolio.json ]; then echo "No new data."; exit 0; fi
            node tools/private/vault.mjs encrypt data/portfolio.private.json data/portfolio.json.enc
            if [ -f data/portfolio.json ]; then git rm -q data/portfolio.json; fi
            git add data/portfolio.json.enc
            if git status --porcelain | grep -v -E '^(M |A |D ) ?data/portfolio\.json(\.enc)?$'; then echo "Unexpected changes"; exit 1; fi
          else
            if git diff --quiet -- data/portfolio.json; then echo "No new data."; exit 0; fi
            if [ "$(git status --porcelain)" != " M data/portfolio.json" ]; then git status --porcelain; echo "Unexpected changes"; exit 1; fi
            git add data/portfolio.json
          fi
          git commit -q -m "data: IBKR Flex snapshot $(node -p 'require("./" + process.env.PORTFOLIO_FILE).asOf')"
          for i in 1 2 3 4; do git push origin HEAD:cinematic-redesign && break; sleep $((i * 10)); done
          # a push made with the workflow token does not start other workflows: start the release explicitly
          gh workflow run cinematic-redesign-checks.yml --ref cinematic-redesign
          # trades, deposits, new or sold positions: notify (an issue opened and closed at once; no amounts)
          if [ -s "$RUNNER_TEMP/changes.txt" ]; then
            url=$(gh issue create --title "IBKR update: portfolio changes published ($(date -u +%F))" --body-file "$RUNNER_TEMP/changes.txt")
            gh issue close "$url" --reason completed
          fi
          # a new position without company artwork: ask Claude to draw it (Card artwork workflow, opens a pull request)
          for id in $(grep -o 'Added as "[a-z0-9-]*"' "$RUNNER_TEMP/changes.txt" 2>/dev/null | cut -d'"' -f2); do
            [ -f "public/brand/$id.svg" ] && continue
            name=$(node -p "(require('./' + process.env.PORTFOLIO_FILE).holdings.find((h) => h.id === '$id') || {}).name || ''")
            ticker=$(node -p "(require('./' + process.env.PORTFOLIO_FILE).holdings.find((h) => h.id === '$id') || {}).ticker || ''")
            gh workflow run card-art.yml --ref cinematic-redesign -f id="$id" -f name="$name" -f ticker="$ticker" || echo "Could not start Card artwork for $id"
          done

      - name: Needs review
        if: steps.flex.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "IBKR daily update needs review ($(date -u +%F))" --body-file "$RUNNER_TEMP/flex.txt"
          exit 1

      - name: Failed
        if: steps.flex.outputs.code != '0' && steps.flex.outputs.code != '2'
        run: exit 1
