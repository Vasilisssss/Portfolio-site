# Builds the static site and publishes it to the gh-pages branch, which GitHub Pages serves at
# https://vasilisssss.github.io/Portfolio-site/  (Settings › Pages › Deploy from a branch: gh-pages / root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Optional: keep portfolio data out of the public repo by storing it in the PORTFOLIO_JSON secret.
      # When the secret is set it overrides data/portfolio.json for this build only.
      - name: Load private portfolio data (optional)
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: |
          if [ -n "$PORTFOLIO_JSON" ]; then
            printf '%s' "$PORTFOLIO_JSON" > data/portfolio.private.json
            echo "Using PORTFOLIO_JSON secret"
          else
            echo "Using data/portfolio.json"
          fi

      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:pages

      - name: Check the export
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/.nojekyll
          grep -q "/${{ github.event.repository.name }}/_next/" out/index.html

      - name: Publish to gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
