# One-off: change the private view's password without knowing the old one.
# GitHub can still use the old secret (nobody can read it), so this job opens data/portfolio.json.enc with the old
# password (PRIVATE_VIEW_PASSWORD) and locks it again with the new one (PRIVATE_VIEW_PASSWORD_NEW), then commits it.
# Afterwards: set PRIVATE_VIEW_PASSWORD to the new password, run "Cinematic redesign checks and release", delete
# PRIVATE_VIEW_PASSWORD_NEW. Then this workflow can be removed.
name: Change private view password

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibkr-daily   # never at the same time as the daily data update, which edits the same file
  cancel-in-progress: false

jobs:
  rekey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinematic-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-lock the data with the new password
        env:
          OLD: ${{ secrets.PRIVATE_VIEW_PASSWORD }}
          NEW: ${{ secrets.PRIVATE_VIEW_PASSWORD_NEW }}
        run: |
          set -e
          if [ -z "$OLD" ]; then echo "PRIVATE_VIEW_PASSWORD (the old one) is not set"; exit 1; fi
          if [ -z "$NEW" ]; then echo "Add the secret PRIVATE_VIEW_PASSWORD_NEW (your new password) first"; exit 1; fi
          if [ "${#NEW}" -lt 12 ]; then echo "The new password must be at least 12 characters"; exit 1; fi
          plain="$RUNNER_TEMP/portfolio.json"
          PRIVATE_VIEW_PASSWORD="$OLD" node tools/private/vault.mjs decrypt data/portfolio.json.enc "$plain"
          PRIVATE_VIEW_PASSWORD="$NEW" node tools/private/vault.mjs encrypt "$plain" data/portfolio.json.enc
          # check: the new file opens with the new password and holds exactly the same data
          PRIVATE_VIEW_PASSWORD="$NEW" node tools/private/vault.mjs decrypt data/portfolio.json.enc "$RUNNER_TEMP/check.json"
          cmp -s "$plain" "$RUNNER_TEMP/check.json"
          rm -f "$plain" "$RUNNER_TEMP/check.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json.enc
          git commit -q -m "Private view: data re-locked with the new password"
          for i in 1 2 3 4; do git push origin HEAD:cinematic-redesign && break; sleep $((i * 10)); done
          echo "Done. Now set PRIVATE_VIEW_PASSWORD to the new password and run the release."
